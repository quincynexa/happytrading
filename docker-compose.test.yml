services:
  postgres-test:
    image: postgres:15-alpine
    ports:
      - "54329:5432"
    environment:
      POSTGRES_USER: hyperfun
      POSTGRES_PASSWORD: hyperfun
      POSTGRES_DB: hyperfun_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hyperfun -d hyperfun_test"]
      interval: 1s
      timeout: 3s
      retries: 30
